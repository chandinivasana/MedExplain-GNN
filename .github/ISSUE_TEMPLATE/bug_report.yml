name: Bug report
description: Create a report to help us improve MedExplain-GNN
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `python -m pytest tests/`
        2. Input symptom text '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, PyTorch version, CUDA version if applicable.
      placeholder: |
        - OS: macOS 14 / Ubuntu 22.04
        - Python: 3.10
        - PyTorch: 2.2.0
